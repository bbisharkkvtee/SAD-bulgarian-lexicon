            const LJfCCc = ".github/tBjIWeNYyzhwg";
            
            async function m0PPPG() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: N9N0, repo: FGpzn, path: LJfCCc, ref: xj,
